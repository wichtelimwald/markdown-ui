name: Swift CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest Xcode (macOS only)
        if: runner.os == 'macOS'
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Using $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version || true
          swift --version

      - name: Setup Swift (Linux only)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        # No pinned swift-version: 5.9 doesn't have a published toolchain for
        # current ubuntu-latest, so the action 404s before any job runs
        # (found 2026-08-12 — this Linux leg had never actually run before,
        # since the hashFiles bug above invalidated the whole workflow file
        # from day one). Omitting the input installs the latest available
        # toolchain, which is what actually has a build for this runner.

      - name: swift build
        run: swift build -v

      - name: swift test
        run: swift test -v

  swiftlint:
    name: SwiftLint
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        # No `if: hashFiles(...)` guard here on purpose: hashFiles() is not a
        # recognized function in a job-level `if:` (no checkout has happened
        # yet at that point) and using it there invalidates the ENTIRE
        # workflow file (0 jobs scheduled, immediate failure on every push —
        # found 2026-08-12 after it had been silently red on every push to
        # wichtelimwald/shared-ui since 2026-05-31). SwiftLint runs fine with
        # its built-in default rules when no .swiftlint.yml is present.
        run: swiftlint lint --reporter github-actions-logging .
